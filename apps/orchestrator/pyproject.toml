[project]
name = "orchestrator"
version = "0.0.0"
description = "MeetingOS agent orchestrator (FastAPI + LangGraph)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    "pydantic>=2.9.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
    "httpx>=0.27.0,<0.28",
    "ruff>=0.7.0,<0.8",
    "mypy>=1.13.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["orchestrator"]
mypy_path = "src"
