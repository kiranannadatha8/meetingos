services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: meetingos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meetingos
      POSTGRES_PASSWORD: meetingos
      POSTGRES_DB: meetingos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetingos -d meetingos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: meetingos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
